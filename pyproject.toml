[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eval_vlm"
version = "0.1.0"
description = "解耦的 VLM 测试集评测工具(split / run / score)"
requires-python = ">=3.9"
dependencies = [
    "openai>=1.0.0",
    "PyYAML>=6.0",
    "Pillow>=9.0.0",
    "tqdm>=4.60.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
webui = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]

[project.scripts]
eval-vlm = "eval_vlm.cli:main"
eval-vlm-webui = "eval_vlm.webui.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eval_vlm = ["templates/*.yaml"]
"eval_vlm.webui" = ["static/*", "static/**/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

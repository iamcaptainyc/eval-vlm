# ============================================================================
# 自动超参搜索配置示例。复制成 config.yaml 填好后:
#   conda run -n <driver_env> python tune.py --config config.yaml
# 整个闭环跑在 GPU 服务器上;路径全部由你填。
# ============================================================================

# --- 环境(conda)---
# 训练/合并用 LlamaFactory 环境;评测用装了 vllm + eval-vlm 的环境。二者可不同。
train_env: llama
eval_env:  vllm
# 切换环境的命令前缀(会被 split 成 token 后拼在命令前)。一般不用改。
conda_run: "conda run --no-capture-output -n"

# --- 路径(全部由你填成服务器上的真实路径)---
base_model: /root/autodl-tmp/models/Qwen3.5-0.8B      # 基座权重(训练与合并都用)
llamafactory_dir: /root/autodl-tmp/LLaMA-Factory      # llamafactory-cli 的工作目录(含 data/ 与 dataset_info.json)
eval_vlm_dataset: /root/autodl-tmp/eval_runs/4dim_road_v2   # eval-vlm 数据集文件夹(含 config.yaml + test.json)
work_root: /root/autodl-tmp/autotune_runs             # 每个 trial 的 adapter/merged/日志/leaderboard 根目录

# --- 训练基础参数(照抄你的 llama_train.sh,不搜索的都放这;model_name_or_path / output_dir 由驱动器自动设)---
base_train_args:
  stage: sft
  do_train: true
  finetuning_type: lora
  template: qwen3_5
  flash_attn: auto
  dataset_dir: data
  dataset: 4dim_road_v2_train          # 用哪个数据集由你定
  cutoff_len: 4096
  num_train_epochs: 3.0
  max_samples: 100000
  lr_scheduler_type: cosine
  max_grad_norm: 1.0
  logging_steps: 5
  save_steps: 100
  warmup_steps: 0
  packing: false
  enable_thinking: true
  report_to: none
  bf16: true
  plot_loss: true
  trust_remote_code: true
  ddp_timeout: 180000000
  include_num_input_tokens_seen: true
  optim: adamw_torch
  save_total_limit: 1
  lora_target: all
  # LoRA:rank 由 search_space 搜;alpha 由顶层 lora_alpha_ratio × rank **派生**(下面这个值只是占位/回退)。
  lora_alpha: 32
  lora_dropout: 0
  # per_device 固定 4:本机显存上限(设 8 必 OOM),**永不搜索**。
  # gradient_accumulation_steps 由 search_space 搜(梯度累加不额外吃显存);此处 16 作回退。
  # lr 与 grad_accum 各自独立搜,不做绑定。
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 16
  freeze_vision_tower: true
  freeze_multi_modal_projector: true
  image_max_pixels: 589824
  image_min_pixels: 1024
  video_max_pixels: 65536
  video_min_pixels: 256

# --- 合并 export 参数(model_name_or_path / adapter_name_or_path / export_dir 由驱动器自动填)---
merge_args:
  template: qwen3_5
  finetuning_type: lora
  export_size: 5
  export_device: cpu

# LoRA alpha 与 rank 的耦合:alpha = lora_alpha_ratio × 采样到的 lora_rank(即 rank = 1/2·alpha 时设 2)。
# 设了它就**不要**再把 lora_alpha 放进 search_space;驱动器会据此自动派生 alpha。null=不派生。
lora_alpha_ratio: 2

# --- 搜索空间(键 = llamafactory 参数名;会覆盖 base_train_args 同名项)---
# type: float_log(对数均匀,给 low/high)| float(均匀)| int | categorical
# 依据 3 组实验收窄:分辨率↑显著涨分(尤其车道位置)、lr 2e-4 优于 1e-4、rank 16 优于 8。
# lr 与 grad_accum **各自独立搜**(不做绑定),由 TPE 自己找组合。
search_space:
  learning_rate:    {type: float_log, low: 1e-4, high: 4.0e-4}          # 围绕 2e-4 偏高(1e-4 实测明显差)
  lora_rank:        {type: categorical, choices: [8, 16, 32, 64]}            # 不搜 8(实测差);alpha=2×rank 自动派生
  image_max_pixels: {type: categorical, choices: [589824, 1048576, 1638400]}  # 768²/1024²/1280²:1024>768,继续往高推(显存不够就去掉 1280²)
  gradient_accumulation_steps: {type: categorical, choices: [8, 16, 32]}  # 有效batch=4×{8,16,32}={32,64,128};per_device 固定 4(本机上限,8 必 OOM)
  num_train_epochs:  {type: categorical, choices: [2.0, 3.0, 4.0, 5.0]}   # epoch:实验用 3.0,搜以找欠/过拟合平衡(每 trial 时长随之变)
  # 想再扩(需更多 trial):
  # neftune_noise_alpha: {type: float, low: 0.0, high: 5.0}
  # freeze_multi_modal_projector: {type: categorical, choices: [true, false]}   # 解冻投影器(对症视觉字段瓶颈)

# --- 优化目标(可选参数)---
objective:
  metric: field_exact_match    # field_exact_match | field_micro | field_macro | mean_score(仅 field_eval:false)
  direction: maximize          # maximize | minimize

# --- 离线 vLLM 评测参数(透传给 eval-vlm 的 vllm_offline 后端)---
eval:
  gpu_memory_utilization: 0.9
  max_model_len: 4096
  image_max_pixels: 589824     # 评测端像素上限;**当 search_space 搜索 image_max_pixels 时,自动改用该 trial 的采样值**(此处仅作未搜索时的回退)
  field_eval: true             # true=用 eval-vlm field-eval(逐字段准确率);false=用 eval-vlm eval(score)

# --- 评测子进程环境变量(在子进程 python 启动前注入,早于 import vllm 生效)---
# 用于禁用/绕过 flashinfer 等。留空(或整段删掉)则不改环境。
eval_env_vars:
  FLASHINFER_DISABLE_VERSION_CHECK: "1"
  VLLM_ATTENTION_BACKEND: FLASH_ATTN     # 不用 flashinfer 注意力后端(或 XFORMERS / TORCH_SDPA)
  VLLM_USE_FLASHINFER_SAMPLER: "0"       # 不用 flashinfer 采样

# --- Optuna ---
optuna:
  n_trials: 20
  study_name: Qwen3_5_0_8B_4dimroad
  storage: null                # null => 自动用 sqlite:///<work_root>/study.db(断点续跑);也可自填
  sampler: tpe                 # tpe(贝叶斯,推荐)| random
  seed: 42

# eval_vlm 数据集配置(单一统一模板,所有命令共用)
# 由 `eval-vlm split --dataset <源json>`(有标注)或 `eval-vlm pred --datadir <图片夹>`(无标注)
# 首次运行时从本模板渲染到该数据集文件夹;之后微调直接手改这个 config.yaml 再重跑即可。
# (机器级路径来自全局配置 ~/.eval_vlm/config.yaml。)
#
# 产物按 模型/后端 分目录:pred/score/eval 的结果落在 <数据集文件夹>/<模型名>/<后端类型>/,
# 同一模型的不同后端互不覆盖(openai/vllm/fake 模型名取 inference.openai.model;
# mnn 取 inference.mnn.config_path 所在目录名;hf 取 model_path 目录名;后端类型取
# inference.backend);split 产物(train/test/val)是各模型共享的,落在数据集文件夹本身。
#
# CLI 覆盖会「永久写回」本文件(用户参数优先且持久化,不是临时):
#   --base-url/--model(pred/eval -> inference.openai.*)、--scorer(score/eval)、
#   --backend、--mnn-config/--mnn-image-max-side(pred -> inference.mnn.*)、
#   --prompt/--system-prompt(pred --datadir -> pred.*)
#
# 一份配置覆盖全部命令,每段都标了「谁用」。与你当前命令无关的段保持默认即可,不会有副作用:
#   data.source / data.mapping / split / eval / scoring  -> split·pred(--dataset)·score·eval 使用
#   data.media_root / image_strip_prefix / inference     -> 所有命令共用
#   pred(下方段)                                        -> 仅 pred --datadir 使用

run_name: {{RUN_NAME}}                 # 仅作展示/元信息;实际产物落在本文件所在文件夹
output_dir: {{OUTPUT_DIR}}             # 工作目录(workspace);仅作元信息

# ---------------------------------------------------------------------------
# 数据(所有命令)
#   source / mapping  -> 仅 split·pred(--dataset)·score·eval(从 LlamaFactory 数据集 JSON 读样本);pred --datadir 留空
#   media_root        -> 所有命令:相对图片路径相对此目录解析(pred 运行时强制指向 --datadir)
# ---------------------------------------------------------------------------
data:
  source: {{SOURCE}}                   # 数据集 JSON(split 用;pred --dataset/score 读本文件夹的 test.json);pred --datadir 为空
  media_root: {{MEDIA_ROOT}}           # 图片相对路径解析根(机器级;pred = 图片文件夹)
  image_strip_prefix: {{IMAGE_STRIP_PREFIX}}   # 跨机训练绝对前缀,本机不需要则 null(机器级)
  # 字段映射(仅 split·pred --dataset·score),对齐 LlamaFactory dataset_info.json。
  # 默认 mllm_demo 风格(messages + role/content + user/assistant)。
  # 若数据是 conversations + from/value + human/gpt,改成下方注释写法即可,无需改代码。
  mapping:
    messages: messages        # 对话列名(另一变体:conversations)
    images: images            # 图片列名
    tags:
      role: role              # 角色字段(另一变体:from)
      content: content        # 内容字段(另一变体:value)
      user: user              # 用户角色取值(另一变体:human)
      assistant: assistant    # 助手角色取值(另一变体:gpt)
  # conversations 变体示例:
  # mapping:
  #   messages: conversations
  #   images: images
  #   tags: {role: from, content: value, user: human, assistant: gpt}

# ---------------------------------------------------------------------------
# 数据划分(仅 split;pred 忽略本段)
# 把源 JSON 纯分割成 train / test(+可选 val),三份都是原样 LlamaFactory 格式。
# train/test/val/seed/stratify_by 的值由 split 命令行参数填入,split 执行完后手改无效。
# ---------------------------------------------------------------------------
split:
  train: {{TRAIN}}            # 训练集比例(--train)
  test: {{TEST}}             # 测试集比例(--test)
  val: {{VAL}}              # 验证集比例(--val;>0 才产出 val.json)
  seed: {{SEED}}             # 固定随机种子(--seed)-> 可复现
  stratify_by: {{STRATIFY_BY}}     # 分层抽样字段(--stratify-by);null 表示不分层
  # 自定义各份输出位置(可直接写到 LlamaFactory data/);留空落到本文件夹。
  # 也可用命令行覆盖:--train-out / --val-out / --test-out。
  train_out: null
  val_out: null
  test_out: null

# ---------------------------------------------------------------------------
# 推理后端(所有命令:pred / eval 都用这段)
# 顶层只选 backend;每个后端的参数归到各自子块,互不冲突、不会「设了却不生效」。
# 切到哪个后端就只读哪个块。新增后端只需加一个子块。
#   backend=openai/vllm/fake -> 读 openai 块;产物 <模型名>=openai.model,<后端类型>=backend
#   backend=mnn              -> 读 mnn 块;产物 <模型名>=mnn.config_path 所在目录名
#   backend=hf               -> 读 hf 块;产物 <模型名>=hf.model_path 目录名
#   backend=vllm_offline     -> 读 vllm_offline 块(离线 vLLM,进程内加载合并权重);产物 <模型名>=vllm_offline.model_path 目录名
# 最终产物落 <数据集>/<模型名>/<后端类型>/。
# CLI 覆盖永久写回:--base-url/--model -> openai.*;--mnn-config/--mnn-image-max-side -> mnn.*;
#   --hf-model -> hf.*;--vllm-model/--vllm-gpu-util/--vllm-max-model-len/--vllm-image-max-pixels -> vllm_offline.*
# ---------------------------------------------------------------------------
inference:
  backend: openai             # openai/vllm(在线 OpenAI 兼容 API,vllm 为别名) | mnn(本地 pymnn) | hf(本地 transformers) | vllm_offline(本地离线 vLLM,加载合并权重) | fake(回显,自检用)
  # openai/vllm 后端(也是 fake 自检走的块):
  openai:
    base_url: http://localhost:8000/v1   # 部署地址(--base-url 永久写回)
    model: trained-vlm        # 部署时注册的模型名(--model 永久写回;也用作产物子目录名)
    api_key_env: OPENAI_API_KEY # 从该环境变量读取 api key(本地服务可随便填)
    system_prompt: null       # 系统提示(pred 也可在下方 pred.system_prompt 设置,后者运行时映射到这里)
    max_concurrency: 8        # 并发请求数
    max_tokens: 1024           # 生成上限
    temperature: 0.0
    request_timeout: 120      # 单请求超时(秒)
    max_retries: 3            # 失败重试次数(指数退避)
    image_detail: auto        # OpenAI image_url 的 detail: auto|low|high
  # mnn 本地后端(只列 mnn 真正会用到的项):
  mnn:
    config_path: null         # 训练后转 mnn 的模型目录里 config.json 的路径,传给 MNN.llm.create();例: /root/autodl-tmp/qwen2-vl-mnn/config.json(--mnn-config 永久写回;也据其所在目录名定产物子目录)
    # 图片预处理(对齐 LlamaFactory 训练时的 mm_plugin 规则;不对齐会导致视觉 token 数
    # 偏离训练分布,推理效果明显变差):
    image_max_pixels: 589824  # 总像素上限(默认 768*768,同 LlamaFactory);超过按 sqrt 因子等比缩小;<=0 关闭
    image_min_pixels: 1024    # 总像素下限(默认 32*32,同 LlamaFactory);不足按 sqrt 因子等比放大;<=0 关闭
    image_max_side: 2048      # 最长边像素上限(native OOM 兜底;经 image_max_pixels 后一般不触发;设 0 关闭)(--mnn-image-max-side 永久写回)
    system_prompt: null       # 系统提示,经 set_config 下发、由 MNN 引擎拼进对话模板;应与训练一致(LlamaFactory qwen2_vl 模板默认 "You are a helpful assistant.");null=沿用模型 config.json
    max_tokens: 1024           # 生成上限(作为 response 的 max_new_tokens)
    # 采样 / 重复抑制(value-gated:每个旋钮按值开关,后端自动翻译成 MNN 采样管线,无需碰 sampler_type)。
    # 小模型(如 0.8B)纯贪心解码遇到「没把握」的图会陷入 \n\n\n… 复读到 max_tokens;
    # 默认「仅开重复惩罚 1.1 + 确定性选词」即可止住复读且结果可复现。规则:
    #   penalty(下面任一惩罚>0)→ 加重复惩罚步;top_k/top_p 设值 → 加对应截断步;
    #   temperature>0 → 随机采样(不可复现);temperature 留空/<=0 → argmax(确定、可复现)。
    repetition_penalty: 1.1   # >1 惩罚已出现 token(含换行);<=1 关闭。复读顽固可调 1.3~1.5
    frequency_penalty: 0.0    # >0 按出现次数累加惩罚(专治同一符号刷屏);0 关闭
    presence_penalty: 0.0     # >0 对出现过的 token 一次性惩罚;0 关闭
    penalty_window: 0         # 惩罚只回看最近 N 个 token;0=整段历史
    temperature: null         # null/<=0=确定性 argmax(可复现);>0=温度随机采样
    top_k: null               # 设值启用 top-k 截断;仅随机采样(temperature>0)有意义
    top_p: null               # 设值启用 nucleus 截断;仅随机采样(temperature>0)有意义
    # 想要标准的 topK+topP 生成式采样(自然多样),取消下面注释即可(结果每次不同):
    # temperature: 0.7
    # top_k: 40
    # top_p: 0.9
    # 高级逃生口:sampler_config 非空则原样下发 MNN 原生键(sampler_type/mixed_samplers…)、跳过上面翻译;
    #   设为 {} 则一概不下发、沿用模型 config.json 自带采样。
    sampler_config: null
    quant: null               # 量化配方标签(如 hqq-4bit / hqq-8bit),纯记录用不参与推理;落进 run_meta/pred_meta 供 report 标注该变体(--mnn-quant 永久写回)
  # hf 本地参考后端(transformers):作「转换前·训练态」基准,与 mnn 做精度对比(precision 命令)。
  # 需要 transformers/torch(+ Qwen2-VL 的 qwen-vl-utils);仅在 backend=hf 或 precision 用到时才需装。
  hf:
    model_path: null          # 本地 HF 权重目录(--hf-model 永久写回;也用作产物子目录名)
    max_tokens: 1024           # generate 的 max_new_tokens
    # 图片预处理:与 mnn 块同一套规则(对齐 LlamaFactory 训练),下发给 processor 的 min/max_pixels,
    # 使参考端与候选端喂给视觉编码器的 token 分布一致(precision 的对齐审计据此比对)。
    image_max_pixels: 589824  # 总像素上限(默认 768*768,同 mnn);下发给 processor(Qwen2-VL 专属);<=0 关闭
    image_min_pixels: 1024    # 总像素下限(默认 32*32,同 mnn);下发给 processor(Qwen2-VL 专属);<=0 关闭
    image_max_side: 0         # 最长边上限:纯等比缩放不 patch 对齐(同 mnn:image_max_side)。非 Qwen 切片模型(如 MiniCPM-V)建议把上面两项设 0、改用本项;<=0 关闭(--hf-image-max-side 永久写回)
    system_prompt: null       # 系统提示(应与训练一致);null=不加
    device: auto              # auto/cuda/cpu(传给 from_pretrained 的 device_map)
    dtype: auto               # auto/bfloat16/float16/float32
    greedy: true              # true=贪心解码(确定可复现,便于与 mnn 逐条对齐);false=模型默认采样
  # vllm_offline 本地离线后端:进程内 vllm 的 LLM() 加载**合并后的全精度权重**推理,不起 HTTP 服务
  # (与 openai/vllm 那种连远端服务的在线后端不同)。主要给自动调参闭环用。需在 backend=hf/mnn 之外
  # 的环境装 vllm;产物 <模型名>=vllm_offline.model_path 目录名。CLI 覆盖:--vllm-model/--vllm-gpu-util/
  # --vllm-max-model-len/--vllm-image-max-pixels 永久写回本块。
  vllm_offline:
    model_path: null          # 合并后全精度权重目录(传给 LLM(model=...);--vllm-model 永久写回;也用作产物子目录名)
    # --- LLM(...) 引擎参数 ---
    gpu_memory_utilization: 0.4    # 显存利用率 0~1(--vllm-gpu-util 永久写回);OOM 就调低
    max_model_len: 4096       # 最大序列长度(含输入+生成)(--vllm-max-model-len 永久写回)
    max_num_seqs: 128         # 引擎最大并发序列数
    max_num_batched_tokens: 20480  # 单批最大 token 数
    # 图片像素上下限:经 mm_processor_kwargs 交给 Qwen-VL processor 内部缩放,**建议与训练 image_max_pixels 对齐**,
    # 否则视觉 token 分布偏离训练。默认 28*28 ~ 720*28*28。
    image_min_pixels: 784     # 28*28
    image_max_pixels: 564480  # 720*28*28(--vllm-image-max-pixels 永久写回)
    dtype: auto               # auto/bfloat16/float16/float32
    trust_remote_code: true   # Qwen-VL 等自定义模型需 true
    # vLLM 环境变量:在 import vllm 之前写入 os.environ(部分变量 import 期就读,晚设无效)。
    # 禁用/绕过 flashinfer 常用:
    # env:
    #   FLASHINFER_DISABLE_VERSION_CHECK: "1"
    #   VLLM_ATTENTION_BACKEND: FLASH_ATTN     # 不用 flashinfer 注意力后端(或 XFORMERS / TORCH_SDPA)
    #   VLLM_USE_FLASHINFER_SAMPLER: "0"       # 不用 flashinfer 采样
    env: null
    vllm_kwargs: null         # 高级逃生口:非空 dict 原样合并进 LLM(**kwargs)(如 {enforce_eager: true})
    # --- 生成参数(SamplingParams)---
    max_tokens: 1024           # 生成上限
    temperature: 0.0          # 0=贪心(确定、可复现);>0=随机采样
    top_p: 1.0                # nucleus 截断;1.0=不截断(仅 temperature>0 有意义)
    top_k: -1                 # top-k 截断;-1=关闭(仅 temperature>0 有意义)
    repetition_penalty: 1.0   # >1 惩罚已出现 token;1.0=关闭
    system_prompt: null       # 系统提示(应与训练一致);null/空=不加

# ---------------------------------------------------------------------------
# 多轮评测策略(仅 pred --dataset·score·eval;pred --datadir 忽略本段)
# 数据常是两轮:轮1 让模型描述图片,轮2 让模型选情绪标签。
# ---------------------------------------------------------------------------
eval:
  targets: all                # all=每个 assistant 轮都评;last=仅最后一轮
  context: rollout            # rollout=用模型自己生成的前文;gold=用数据集标准前文

# ---------------------------------------------------------------------------
# 评分(仅 score·eval;pred 忽略本段)
# ---------------------------------------------------------------------------
scoring:
  scorer: exact_match         # 默认 scorer(已注册名称);可被 --scorer 覆盖
  turn_scorers: []            # 逐轮指定(按目标顺序),缺省回落到 scorer
  # 内置:exact_match(归一化精确匹配)、token_f1(字符级相似度,中文友好)、
  #       prefix_match:K(只比较归一化后前 K 个字符是否完全相同,如轮2标签)、
  #       contain_acc(归一化后 pred 包含 ref 即算对,适合答案是短标签、输出带解释)
  # 例:轮1描述用 token_f1(相似度),轮2标签比前 10 个字符:
  # turn_scorers: [token_f1, prefix_match:10]

# ---------------------------------------------------------------------------
# 无标注图片的对话怎么组织(仅 pred --datadir;其它命令忽略本段)
# 两种写法二选一:
#   1) 单轮简写:只设 prompt(+可选 system_prompt)。每张图发一轮 user 消息;
#      若 prompt 不含 <image>,会自动在最前面加一个。(可用 --prompt 临时覆盖)
#   2) 多轮模板:取消注释 template(role/content 列表),它会覆盖 prompt。
#      可加纯文本的 assistant/user 轮做 few-shot 引导。
# 规则:全部轮里 <image> 必须恰好出现 1 次且位于某个 user 轮;最后一轮必须是 user。
# ---------------------------------------------------------------------------
pred:
  prompt: 请描述这张图片。          # 单轮默认提示词(--prompt 永久写回本字段)
  system_prompt: null         # 可选系统提示(--system-prompt 永久写回本字段)
  # template:                 # 多轮模板(取消注释并编辑;设置后覆盖 prompt)
  #   - {role: user, content: "我会给你一张图片,请用简体中文、200 字以内、客观描述画面内容。"}
  #   - {role: assistant, content: "好的,请提供图片。"}
  #   - {role: user, content: "<image>请描述这张图片"}

# ---------------------------------------------------------------------------
# 标签抽取(仅 pred --datadir --label-extract;其它命令忽略本段)
# 描述完成后,把每张图的描述 POST 给远程标签服务({base_url}{path},请求体 {"text":描述}),
# 解析响应 data.labels.cn 里非「无」的中文标签,扁平合并写到 label.jsonl(每行 {image, labels});
# 失败记 label_failures.jsonl,不中断整批,可重跑补齐。断点续跑跳过已完成,--overwrite 整份重抽。
# CLI 覆盖永久写回:--label-extract-url -> base_url;--label-extract-token -> auth_token。
# ---------------------------------------------------------------------------
label_extract:
  base_url: https://canghai-agent-api-test.aijidou.com/   # 服务根地址(--label-extract-url 永久写回)
  path: api/v1/vlm/label-extract                           # 接口路径
  # Authorization 头完整值(含 bearer 前缀)。测试 token 会过期,过期后用
  # --label-extract-token 覆盖(永久写回),或直接改这里。
  auth_token: bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VyX2lkIjoyLCJleHAiOjE3ODMzMjM4NDJ9.ggJb41tshiLZ-cmNEobWf9BygqlYynFmfj5OPEQARqs
  request_timeout: 30         # 单请求超时(秒)
  max_retries: 3              # 失败重试次数(指数退避)
  max_concurrency: 4          # 抽取并发(纯 I/O,与推理后端是否串行无关)
  none_label: 无              # cn 中表示「无该类目」的占位值,过滤掉

# ---------------------------------------------------------------------------
# 精度对比(仅 precision 命令;其它命令忽略本段)
# 量化 mnn(转换后)相对 hf(转换前)的**行为级**误差:读两份已生成的 predictions.jsonl
# (候选=<模型名>/mnn/、参考=<模型名>/hf/,均由 pred 产出)按 (id,turn) 对比,出 precision.json/.md。
# 流程:pred --backend hf --hf-model <目录>  ->  pred --backend mnn --mnn-config <config.json>
#       ->  precision --dataset <本数据集>
# candidate_dir/reference_dir 留空则默认取 inference.mnn / inference.hf 的模型名。
# ---------------------------------------------------------------------------
precision:
  candidate_dir: null         # 候选(转换后·MNN)模型名(其 mnn 子目录);null=按 inference.mnn 推断
  reference_dir: null         # 参考(转换前·HF)模型名(其 hf 子目录);null=按 inference.hf 推断
  agreement_min: 0.9          # 输出完全一致率低于此值 -> 报告标注「行为偏差偏大」
  token_f1_min: 0.9           # 平均 char token-F1 低于此值 -> 标注「文本相似度偏低」
  alignment_strict: true      # prompt token 数 / 图片像素数有任一 delta≠0 即标注「预处理不对齐」
  max_worst_samples: 20       # precision.md 里展开的「最差样本」条数
  quality_regression_max: 0.05  # 净质量Δ:候选相对 HF 的净回归率(HF对/候选错占比)超此值 -> 报告标 🔴(需两端都跑过 score)

# ---------------------------------------------------------------------------
# onnx-precision:torch/safetensors ↔ ONNX 的**逐层激活**数值级精度校验(与行为级 precision 互补)。
#   命令:onnx-precision --dataset <本数据集> [--hf-model <safetensors目录>] [--targets vit,llm]
# 把参考模型的视觉塔(ViT)/ LLM 解码器各自包装成「每层边界都是具名输出」的 probe ONNX,
# 对一组图做前向,逐层比对 onnxruntime(ONNX 候选)vs torch(safetensors 参考)的中间激活,
# 定位第一个发散的层。校验 torch→ONNX 导出保真度(管线 safetensors→ONNX→MNN 前半段)。
# 仅支持 Qwen2-VL/2.5-VL/3-VL 家族;参考权重复用 inference.hf.model_path;需 torch+onnx+onnxruntime。
# ---------------------------------------------------------------------------
onnx_precision:
  targets: ["vit", "llm"]     # 对比哪些子模型:vit(视觉塔)/ llm(解码器)
  num_samples: 8              # 取几张图做逐层前向对比(逐层前向较贵,默认小批)
  dtype: float32              # torch 参考 + 导出统一精度;float32 隔离 dtype 噪声、只测导出保真度
  device: cpu                 # 导出/参考跑在哪(cpu 最稳,与 onnxruntime CPU 对齐)
  cosine_min: 0.9999          # 逐层 cosine 低于此 -> 判该层发散
  rel_l2_max: 0.01            # 逐层相对 L2 误差高于此 -> 判该层发散
  opset: 17                   # torch.onnx.export 的 opset
  keep_onnx: false            # true 保留导出的 probe onnx 到 <模型>/onnx-precision/probe_onnx/(默认跑完删)
  max_layers_in_report: 64    # onnx_precision.md 逐层表最多展开的层数
